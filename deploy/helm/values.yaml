# agentgitops Helm Chart values
# Default values for agentgitops on Kubernetes

replicaCount: 1

image:
  repository: ghcr.io/terrymyth/agentgitops-open
  pullPolicy: IfNotPresent
  tag: "0.1.0"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 4789

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: agentgitops.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Persistence
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 1Gi
  mountPath: /workspace

# Environment variables
env:
  AGENTGITOPS_HOST: "0.0.0.0"
  AGENTGITOPS_PORT: "4789"
  AGENTGITOPS_MODE: "full"

# Reference an existing Kubernetes Secret whose keys become container environment variables.
# Keep provider tokens and other credentials out of Helm values and command-line arguments.
existingSecret: ""

# Probes
livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}
tolerations: []
affinity: {}

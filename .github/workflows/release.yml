name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: write
  id-token: write
  packages: write

jobs:
  release:
    if: github.repository == 'terrymyth/agentgitops-open'
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Validate release metadata
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            pnpm validate:release:metadata -- --release-ref "$GITHUB_REF_NAME"
          else
            pnpm validate:release:metadata
          fi

      - name: Full quality gate
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm --filter @agentgitops/web test:coverage
          pnpm build
          pnpm format:check
          pnpm validate:schemas
          pnpm validate:release -- --public
          pnpm validate:release:history

      - name: Real Docker, Compose and Helm smoke
        env:
          AGENTGITOPS_SMOKE_DEPLOY_REAL: "1"
        run: pnpm smoke:deployment

      - name: Published-package install smoke
        run: pnpm smoke:npm-install -- --skip-build

      - name: npm publish dry-run
        run: pnpm release:npm:dry-run

      - name: Resolve release context
        id: release-context
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/terrymyth/agentgitops-open
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=tag
            type=sha,prefix=candidate-

      - name: Login to GHCR
        if: steps.release-context.outputs.publish == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish image
        id: docker-build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ steps.release-context.outputs.publish != 'true' }}
          push: ${{ steps.release-context.outputs.publish == 'true' }}
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}

      - name: Prepare artifact directory
        run: mkdir -p release-artifacts

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: release-artifacts/source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate image SBOM
        if: steps.release-context.outputs.publish == 'true'
        uses: anchore/sbom-action@v0.24.0
        with:
          image: ghcr.io/terrymyth/agentgitops-open:${{ github.ref_name }}
          format: spdx-json
          output-file: release-artifacts/image.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Build release artifacts and checksums
        shell: bash
        run: |
          for package_dir in packages/core packages/git packages/local-hub apps/server apps/cli; do
            pnpm --dir "$package_dir" pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"
          done
          helm lint deploy/helm
          helm package deploy/helm --destination release-artifacts
          (
            cd release-artifacts
            find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agentgitops-${{ github.ref_name }}
          path: release-artifacts/
          if-no-files-found: error

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: release-artifacts/*

      - name: Attest published container image
        if: steps.release-context.outputs.publish == 'true'
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/terrymyth/agentgitops-open
          subject-digest: ${{ steps.docker-build.outputs.digest }}
          push-to-registry: true

      - name: Publish npm packages with provenance
        if: steps.release-context.outputs.publish == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "NPM_TOKEN is required for a tagged release" >&2
            exit 1
          fi
          pnpm release:npm

      - name: Publish GitHub Release
        if: steps.release-context.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "AgentGitOps $GITHUB_REF_NAME"
